<svg xmlns="http://www.w3.org/2000/svg" width="180" height="40" viewBox="0 0 180 40">

  <!-- Kitap ikonu — beyaz arka plan, her temada görünür -->
  <rect x="0" y="0" width="40" height="40" rx="9" fill="#ffffff" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Sol sayfa -->
  <rect x="5" y="6" width="13" height="28" rx="2" fill="#EBEBEB"/>
  <!-- Sağ sayfa -->
  <rect x="22" y="6" width="13" height="28" rx="2" fill="#E0E0E0"/>
  <!-- Omurga -->
  <rect x="19" y="6" width="3" height="28" rx="1" fill="#C8C8C8"/>

  <!-- Kamera -->
  <circle cx="28.5" cy="16" r="4.5" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="28.5" cy="16" r="1.8" fill="#1A1A1A"/>
  <circle cx="32" cy="12.5" r="1" fill="#1A1A1A" opacity="0.4"/>

  <!-- Çizgiler -->
  <rect x="7" y="11" width="9" height="1.5" rx="0.75" fill="#AAAAAA"/>
  <rect x="7" y="15" width="6" height="1.5" rx="0.75" fill="#AAAAAA"/>
  <rect x="7" y="19" width="8" height="1.5" rx="0.75" fill="#C0C0C0"/>

  <!-- Alt foto çerçeve -->
  <rect x="22" y="27" width="11" height="5" rx="1.5" fill="none" stroke="#AAAAAA" stroke-width="0.8"/>
  <path d="M22 31 l3-2.5 2 2 2-1.5 4 3z" fill="#C0C0C0"/>

  <!-- Wordmark -->
  <text x="50" y="26"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="19"
    font-weight="700"
    fill="currentColor"
    letter-spacing="-0.4">snap</text>
  <text x="93" y="26"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="19"
    font-weight="300"
    fill="currentColor"
    opacity="0.5"
    letter-spacing="-0.4">book</text>

</svg>
